bind_addr = "127.0.0.1"
port = 9090
document_root = "public"
max_header_bytes = 8192
max_body_bytes = 1048576

# Seconds a client has to send the request headers, and then again for the
# body. This is a TOTAL deadline, so sending one byte at a time doesn't help.
read_timeout_secs = 10

# Seconds a single write to a client may stall before we give up on it.
write_timeout_secs = 30

# Most connections handled at once. Extra ones get "503 Service Unavailable".
max_connections = 1000

# How long an idle connection may wait for its next request.
keep_alive_timeout_secs = 5

# Most requests served on one connection before we close it.
# Set to 1 to turn keep-alive off.
max_requests_per_connection = 100


# ---------- HTTPS (optional) ----------
# Uncomment both lines to turn HTTPS on. For local testing, make a
# development certificate with:  cargo run --example gen_cert
# tls_cert_path = "certs/dev-cert.pem"
# tls_key_path = "certs/dev-key.pem"

# The port HTTPS listens on. With HTTPS on, "port" above then redirects here.
https_port = 8443

# With HTTPS on, send plain-HTTP visitors to the HTTPS site.
redirect_http_to_https = true

# Tell browsers to insist on HTTPS for this many seconds (Strict-Transport-Security).
# Leave at 0 while testing: browsers remember it, and a mistake can lock you out.
hsts_max_age_secs = 0

# Seconds a client has to finish the TLS handshake.
tls_handshake_timeout_secs = 10

# ---------- Compression ----------
# Compress text-like files (HTML, CSS, JavaScript, JSON, SVG...) for clients that ask.
compression = true

# Files smaller than this are not worth compressing.
compress_min_bytes = 256

# Files bigger than this are not compressed on the fly (they are held in memory
# while compressing). Use precompressed copies for those.
compress_max_bytes = 2097152

# Use "app.js.br" and "app.js.gz" files next to the original when they exist
# and are not older than it.
serve_precompressed = true

# ---------- Caching ----------
# Cache-Control for files that match no rule below. "no-cache" means "you may
# keep a copy, but ask me before using it", so edits show up at once.
# Use an empty string ("") to send no Cache-Control header at all.
default_cache_control = "no-cache"

# Rules by file extension: the first matching rule wins. Uncomment to let
# browsers reuse these files for an hour without asking.
# cache_rules = [
#   { extensions = ["css", "js", "svg", "png", "jpg", "gif", "webp", "woff2"], cache_control = "public, max-age=3600" },
# ]

# ---------- Logging and monitoring ----------
# Write one log line per request (log target "access").
# To silence it:  set RUST_LOG=info,access=off
access_log = true

# Include the query string ("?x=1") in access logs. Off by default, because
# query strings often hold passwords, tokens or personal data.
log_query_strings = false

# A page at /status with counters, as JSON. Off by default.
status_page = false

# Who may see it: exact addresses only. A request that came through another
# proxy (it carries X-Forwarded-For) is always refused, even from these.
status_allowed_ips = ["127.0.0.1", "::1"]

# ---------- Reverse proxy ----------
# Seconds allowed for connecting to a proxied program.
proxy_connect_timeout_secs = 5

# The largest response accepted from a proxied program. It is held in memory,
# so keep it modest. Bigger responses get "502 Bad Gateway".
proxy_max_response_bytes = 16777216

# Forward some paths to another program: one [[proxy]] block per route.
# Keep these blocks at the END of this file.
# [[proxy]]
# prefix = "/api"                # "/api" and "/api/..." are forwarded
# upstream = "127.0.0.1:3000"    # host:port of the other program
# strip_prefix = true            # "/api/users" reaches the upstream as "/users"
# timeout_secs = 30              # how long the upstream has to answer